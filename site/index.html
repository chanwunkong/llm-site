<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F3EFE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>單字領土</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="langBtn" class="pill"></button>
    <div class="res" title="金幣"><i class="shape circle yellow"></i><b id="gold">0</b></div>
    <div class="res" title="領土格數"><i class="shape hex blue"></i><b id="tileCount">0</b></div>
    <button id="setBtn" class="icon-btn" aria-label="設定"><svg class="glyph" width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="none" stroke="#111" stroke-width="3"/><path d="M12 1v5M12 18v5M1 12h5M18 12h5M4.2 4.2l3.5 3.5M16.3 16.3l3.5 3.5M4.2 19.8l3.5-3.5M16.3 7.7l3.5-3.5" stroke="#111" stroke-width="2.5"/></svg></button>
  </header>
  <div id="simBar" hidden><span>模擬模式・不影響真正的進度</span><button id="simExit" class="btn sm">退出</button></div>

  <main id="views">
    <section id="view-land" class="view"></section>
    <section id="view-home" class="view"></section>
    <section id="view-skills" class="view"></section>
    <section id="view-sounds" class="view"></section>
  </main>

  <nav id="nav">
    <button data-tab="land"><i class="shape hex blue"></i><span>領土</span></button>
    <button data-tab="home"><i class="shape triangle red"></i><span>冒險</span></button>
    <button data-tab="skills"><i class="shape circle yellow"></i><span>文法</span></button>
    <button data-tab="sounds"><i class="shape half ink"></i><span>發音</span></button>
  </nav>

  <section id="play" hidden></section>

  <div id="sheet" hidden><div class="backdrop"></div><div class="card"><div class="grip"></div><div class="body"></div></div></div>
  <div id="toast"></div>
  <div id="loading"><i class="shape square red spin"></i>載入中…</div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
