<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#10304a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>單字領土</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="langBtn" class="pill"></button>
    <div class="res" title="金幣">🪙 <b id="gold">0</b></div>
    <div class="res" title="領土格數">🧩 <b id="tileCount">0</b></div>
    <button id="setBtn" class="icon-btn" aria-label="設定">⚙️</button>
  </header>

  <main id="views">
    <section id="view-land" class="view"></section>
    <section id="view-home" class="view"></section>
    <section id="view-skills" class="view"></section>
    <section id="view-sounds" class="view"></section>
  </main>

  <nav id="nav">
    <button data-tab="land"><i>🗺️</i><span>領土</span></button>
    <button data-tab="home"><i>⚔️</i><span>冒險</span></button>
    <button data-tab="skills"><i>✨</i><span>技能</span></button>
    <button data-tab="sounds"><i>🗣️</i><span>發音</span></button>
  </nav>

  <section id="play" hidden></section>

  <div id="sheet" hidden><div class="backdrop"></div><div class="card"><div class="grip"></div><div class="body"></div></div></div>
  <div id="toast"></div>
  <div id="loading"><div class="spin">⭐</div>載入中…</div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
